# user / admin の両アプリが共有する設定。
#
# 各アプリの application.yaml から `spring.config.import` で読み込む。取り込まれた側の
# 優先度は取り込む側より低いので、アプリ固有の値は application.yaml に書けば上書きできる。
#
# application.yaml という名前にしないこと。クラスパス上の application.yaml は先に見つかった
# 1本しか読まれず、common 側かアプリ側のどちらかが黙って無視される。
spring:
  datasource:
    # ホスト名 db は .devcontainer/compose.yaml のサービス名。
    url: jdbc:mysql://db:3306/space_reserve
    username: app
    password: app
  data:
    redis:
      # ホスト名 redis は .devcontainer/compose.yaml のサービス名。
      host: redis
      port: 6379
  session:
    timeout: 30m
    # Boot 4.0 で spring.session.redis.* は spring.session.data.redis.* へ移った。
    # 旧名を書いても解決されず黙って無視される（エラーも警告も出ない）ため、
    # namespace が既定の spring:session に戻っていることに気づけない。
    data:
      redis:
        # 後で Redis をキャッシュ等と共用したときにキーが混ざらないよう名前空間を切る。
        # user と admin で同じ値にすること。ここを分けると同じ Cookie を持っていても
        # 相手側のセッションを見つけられなくなる。
        namespace: space-reserve:session
        flush-mode: on-save
  mvc:
    problemdetails:
      # エラー応答を RFC 9457 (application/problem+json) に統一する。
      enabled: true

mybatis:
  # SQL と resultMap は XML に置く。Mapper インターフェースには注釈で SQL を書かない。
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # password_hash → passwordHash。resultMap を書く場合も、これがあると
    # 素直な対応のカラムを <result> で列挙せずに済む。
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  login:
    rate-limit:
      # 「メールアドレス + 送信元 IP」ごとの上限。アカウントロックではないため、
      # 締め出されるのは攻撃元の IP に限られる（authentication.md 9 節）。
      # LoginAttemptService が common にあり両アプリで動くため、値もここに置く。
      threshold: 10
      # 最後の失敗からこの時間で数え直す。
      window: 15m
